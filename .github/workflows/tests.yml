name: Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install hardware tools (Yosys and Icarus Verilog)
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys iverilog

      - name: Install package
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest tests/

      - name: Run ruff
        run: ruff check src/ tests/
